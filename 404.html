<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Primary Meta Tags -->
    <meta name="description" content="Page Not Found - Content & Co" />
    <meta name="theme-color" content="#10b981" />
    <meta name="robots" content="noindex, follow" />
    
    <!-- Page Title -->
    <title>Page Not Found - Content &amp; Co</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Favicons -->
    <link rel="icon" href="assets/Google%20search.png" type="image/png" />
    <link rel="apple-touch-icon" href="Favicon.webp" />

    <style>
      /* ─── Reset ─── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --font-sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
        --font-serif: "Instrument Serif", "Georgia", serif;
        --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", "Consolas", monospace;
        --accent: #10b981;
        --accent-glow: rgba(16, 185, 129, 0.6);
        --accent-soft: rgba(16, 185, 129, 0.09);
        --bg: #fafaf9;
        --text: #18181b;
        --text-muted: #71717a;
        --text-faint: rgba(113, 113, 122, 0.8);
        --border-light: rgba(212, 212, 216, 0.7);
      }

      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family: var(--font-sans);
        color: var(--text);
        background: var(--bg);
        overflow-x: hidden;
      }

      /* ─── Main layout ─── */
      .map-page {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 100svh;
        overflow-x: hidden;
        background:
          radial-gradient(90% 60% at 50% -12%, var(--accent-soft), transparent 60%);
      }

      /* Nature Background */
      .map-bg-nature {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: url('Background nature.webp') center/cover no-repeat;
        opacity: 0.2;
        pointer-events: none;
      }

      /* ─── Center radial glow ─── */
      .center-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 0;
        width: 38vh;
        height: 38vh;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(250,250,249,0.7), rgba(250,250,249,0.28) 50%, transparent 72%);
        pointer-events: none;
      }

      /* ─── Corner brackets ─── */
      .corner-brackets {
        position: absolute;
        inset: 1rem;
        z-index: -1;
        pointer-events: none;
      }

      .corner-brackets span {
        position: absolute;
        width: 1rem;
        height: 1rem;
      }

      .corner-brackets .tl { top: 0; left: 0; border-left: 1px solid var(--border-light); border-top: 1px solid var(--border-light); }
      .corner-brackets .tr { top: 0; right: 0; border-right: 1px solid var(--border-light); border-top: 1px solid var(--border-light); }
      .corner-brackets .bl { bottom: 0; left: 0; border-left: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); }
      .corner-brackets .br { bottom: 0; right: 0; border-right: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); }

      @media (min-width: 24rem) {
        .corner-brackets { inset: 1.5rem; }
      }

      /* ─── Side labels ─── */
      .side-label {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        white-space: nowrap;
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.32em;
        color: var(--text-faint);
        pointer-events: none;
        display: none;
      }

      .side-label-left {
        left: 1.25rem;
        transform: translateY(-50%) rotate(-90deg);
      }

      .side-label-right {
        right: 1.25rem;
        transform: translateY(-50%) rotate(90deg);
      }

      @media (min-width: 64rem) {
        .side-label { display: block; }
      }

      /* ─── Header ─── */
      .map-header {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.25rem 1.5rem;
      }

      @media (min-width: 40rem) {
        .map-header { padding: 1.25rem 2.5rem; }
      }

      .map-header-left {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent-glow);
        animation: pulse-dot 2.5s ease-in-out infinite;
      }

      @keyframes pulse-dot {
        0%, 100% { box-shadow: 0 0 12px var(--accent-glow); }
        50% { box-shadow: 0 0 20px var(--accent-glow), 0 0 4px var(--accent); }
      }

      .map-header-label {
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: #52525b;
      }

      .map-header-nav {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .map-nav-link {
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--text-muted);
        text-decoration: none;
        padding: 0.4rem 0.75rem;
        border-radius: 100px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--border-light);
        backdrop-filter: blur(4px);
        transition: all 0.2s ease;
        white-space: nowrap;
      }

      .map-nav-link:hover {
        color: var(--text);
        border-color: var(--accent);
        background: #ffffff;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
      }

      /* ─── Hero / Content area ─── */
      .map-hero {
        position: relative;
        z-index: 5;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        max-width: 48rem;
        margin: 0 auto;
        padding: 3rem 1.5rem 6rem;
      }

      .map-instrument-label {
        font-family: var(--font-mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        color: var(--accent);
        font-weight: 500;
      }

      .map-divider {
        display: block;
        width: 1.5rem;
        height: 1px;
        background: var(--accent);
        margin: 1.5rem 0;
        opacity: 0.4;
      }

      .map-heading {
        font-family: var(--font-serif);
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 400;
        line-height: 1.05;
        color: var(--text);
        margin-bottom: 1.25rem;
        letter-spacing: -0.01em;
      }

      .map-subheading {
        font-family: var(--font-sans);
        font-size: clamp(1rem, 2.5vw, 1.125rem);
        line-height: 1.6;
        color: var(--text-muted);
        max-width: 32rem;
        margin-bottom: 2.5rem;
      }

      .map-cta-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      .map-cta {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--text);
        color: #ffffff;
        font-family: var(--font-mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-weight: 500;
        text-decoration: none;
        padding: 1rem 1.75rem;
        border-radius: 100px;
        border: 1px solid var(--text);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      }

      .map-cta:hover {
        background: var(--accent);
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
      }

      .map-cta-arrow {
        width: 12px;
        height: 12px;
        transition: transform 0.2s ease;
      }

      .map-cta:hover .map-cta-arrow {
        transform: translateX(3px);
      }

      .map-secondary-link {
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--text-muted);
        text-decoration: underline;
        text-underline-offset: 4px;
        transition: color 0.2s ease;
      }

      .map-secondary-link:hover {
        color: var(--text);
      }

      /* ─── Animations ─── */
      .anim-fade-up {
        opacity: 0;
        transform: translateY(16px);
        animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .anim-delay-1 { animation-delay: 0.1s; }
      .anim-delay-2 { animation-delay: 0.2s; }
      .anim-delay-3 { animation-delay: 0.3s; }
      .anim-delay-4 { animation-delay: 0.4s; }

      @keyframes fade-up {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .anim-fade-up {
          opacity: 1;
          transform: none;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="map-page">
      <div class="map-bg-nature" aria-hidden="true"></div>
      <div class="center-glow" aria-hidden="true"></div>

      <!-- Corner brackets -->
      <div class="corner-brackets" aria-hidden="true">
        <span class="tl"></span>
        <span class="tr"></span>
        <span class="bl"></span>
        <span class="br"></span>
      </div>

      <!-- Side Labels -->
      <span class="side-label side-label-left" aria-hidden="true">Content &amp; Co · Creator Marketing</span>
      <span class="side-label side-label-right" aria-hidden="true">Error Code · 404 Not Found</span>

      <!-- Header -->
      <header class="map-header">
        <div class="map-header-left anim-fade-up anim-delay-1">
          <span class="status-dot"></span>
          <span class="map-header-label">Content &amp; Co</span>
        </div>
        <div class="map-header-nav anim-fade-up anim-delay-2">
          <a href="index.html" class="map-nav-link">Home</a>
          <a href="creators.html" class="map-nav-link">For Creators</a>
          <a href="blog.html" class="map-nav-link">Blog</a>
        </div>
      </header>

      <!-- Hero -->
      <div class="map-hero">
        <span class="map-instrument-label anim-fade-up anim-delay-1">Lost in Content · 404</span>
        <span class="map-divider anim-fade-up anim-delay-2" aria-hidden="true"></span>
        <h1 class="map-heading anim-fade-up anim-delay-2">Page Not Found</h1>
        <p class="map-subheading anim-fade-up anim-delay-3">
          The link you followed might be broken, or the page may have been moved. Let's get you back on track.
        </p>
        <div class="map-cta-wrap anim-fade-up anim-delay-4">
          <a href="index.html" class="map-cta">
            Return to Homepage
            <svg class="map-cta-arrow" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8.22 2.97a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 8 8.22 4.28a.75.75 0 0 1 0-1.06Z"></path>
              <path d="M12.5 8H3.75a.75.75 0 0 1 0-1.5h8.75a.75.75 0 0 1 0 1.5Z"></path>
            </svg>
          </a>
          <a href="mailto:tafiqul@contentco.info" class="map-secondary-link">Contact Support</a>
        </div>
      </div>
    </div>
  </body>
</html>
